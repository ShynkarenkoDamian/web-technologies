<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Таблиця з об’єднаними клітинками</title>
</head>
<body>
<main>
    <div align="center">
        <h2>Завдання 1</h2>
    <table width="400" height="400" border="2" cellspacing="0" cellpadding="0"
           aria-label="Кольорова таблиця з об’єднаними рядками та колонками">
        <colgroup>
            <col width="50"><col width="50"><col width="50"><col width="50">
            <col width="50"><col width="50"><col width="50"><col width="50">
        </colgroup>
        <tbody>
        <tr height="50">
            <td bgcolor="#6a4c93" colspan="8"></td>
        </tr>
        <tr height="50">
            <td bgcolor="#ffe5d9" rowspan="6"></td>
            <td bgcolor="#6a4c93" colspan="6"></td>
            <td bgcolor="#ffe5d9" rowspan="6"></td>
        </tr>
        <tr height="50">
            <td bgcolor="#ffe5d9" rowspan="4"></td>
            <td bgcolor="#6a4c93" colspan="4"></td>
            <td bgcolor="#ffe5d9" rowspan="4"></td>
        </tr>
        <tr height="50">
            <td bgcolor="#ffe5d9" rowspan="2"></td>
            <td bgcolor="#ffbe0b"></td>
            <td bgcolor="#00a896"></td>
            <td bgcolor="#ffe5d9" rowspan="2"></td>
        </tr>
        <tr height="50">
            <td bgcolor="#f15bb5"></td>
            <td bgcolor="#3a86ff"></td>
        </tr>
        <tr height="50">
            <td bgcolor="#6a4c93" colspan="4"></td>
        </tr>
        <tr height="50">
            <td bgcolor="#6a4c93" colspan="6"></td>
        </tr>
        <tr height="50">
            <td bgcolor="#6a4c93" colspan="8"></td>
        </tr>
        </tbody>
    </table>
    </div>
    <div align="center">
        <h2>Завдання 2</h2>
        <table width="500" height="600" border="0" cellpadding="0" cellspacing="8" bgcolor="#000000"
               aria-label="Композиція з червоним, синім і жовтим">
            <colgroup>
                <col width="40"><col width="40"><col width="40"><col width="40"><col width="40">
                <col width="40"><col width="40"><col width="40"><col width="40"><col width="40">
            </colgroup>
            <tbody>
            <tr height="50">
                <td bgcolor="#ffffff" colspan="2"></td>
                <td bgcolor="#ffffff" colspan="5"></td>
                <td bgcolor="#fffa69" colspan="3"></td>
            </tr>
            <tr height="50">
                <td bgcolor="#ffffff" rowspan="7"></td>
                <td bgcolor="#ff5b2d" rowspan="5" colspan="6"></td>
                <td bgcolor="#fffa69" rowspan="2" colspan="3"></td>
            </tr>
            <tr height="50"></tr>
            <tr height="50">
                <td bgcolor="#ffffff" rowspan="3" colspan="2"></td>
                <td bgcolor="#ffffff" rowspan="3"></td>
            </tr>
            <tr height="50">
                <td bgcolor="#ffffff" rowspan="2"></td>
                <td bgcolor="#ffffff"></td>
            </tr>
            <tr height="50">
                <td bgcolor="#ffffff" colspan="2"></td>
                <td bgcolor="#ffffff"></td>
            </tr>
            <tr height="50">
                <td bgcolor="#000000" colspan="3" rowspan="2"></td>
                <td bgcolor="#ffffff" colspan="3" rowspan="2"></td>
                <td bgcolor="#ffffff" colspan="3"></td>
                <td bgcolor="#ffffff"></td>
            </tr>
            <tr height="50">
                <td bgcolor="#ffffff" colspan="3"></td>
                <td bgcolor="#ffffff"></td>
            </tr>
            <tr height="50">
                <td bgcolor="#fffa69" rowspan="4"></td>
                <td bgcolor="#000000" colspan="3"></td>
                <td bgcolor="#ffffff" colspan="3"></td>
                <td bgcolor="#074481" colspan="3" rowspan="4"></td>
            </tr>
            <tr height="50">
                <td bgcolor="#ffffff" colspan="3" rowspan="3"></td>
                <td bgcolor="#000000" colspan="3" rowspan="3"></td>
            </tr>
            <tr height="50"></tr>
            <tr height="50"></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
