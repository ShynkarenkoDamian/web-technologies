<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Завдання 5 — тіні та накладання</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1 class="page-title">Завдання 5 · Тіні, прозорість і шари</h1>
    <section class="weather-scene" aria-label="Приклад накладання погодних карток">
      <div class="forecast-card">
        <div class="forecast-days">
          <div class="forecast-day"><span class="day-name">Mon</span><span class="day-temperature">17°</span></div>
          <div class="forecast-day"><span class="day-name">Tue</span><span class="day-temperature">19°</span></div>
          <div class="forecast-day"><span class="day-name">Wed</span><span class="day-temperature">16°</span></div>
          <div class="forecast-day"><span class="day-name">Thu</span><span class="day-temperature">18°</span></div>
          <div class="forecast-day"><span class="day-name">Fri</span><span class="day-temperature">21°</span></div>
        </div>
      </div>
      <div class="current-card">
        <div class="weather-cloud" aria-hidden="true"></div>
        <div class="weather-controls" aria-hidden="true"><span class="weather-arrow">←</span><span class="weather-arrow">→</span></div>
        <span class="current-temperature">17°</span>
      </div>
    </section>
  </main>
</body>
</html>
