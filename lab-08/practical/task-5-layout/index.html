<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Адаптивний макет — CSS Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <a class="back" href="../index.html">← До списку завдань</a>
    <h1>Адаптивний макет</h1>
    <p>Обидва приклади перебудовуються для телефона, планшета та комп'ютера.</p>

    <section class="example">
      <h2>1. Колонки та рядки</h2>
      <div class="layout layout-rows">
        <header class="region header">header</header>
        <nav class="region navigation">navigation</nav>
        <aside class="region sidebar">sidebar</aside>
        <section class="region content">main</section>
        <aside class="region ads">ads</aside>
        <footer class="region footer">footer</footer>
      </div>
    </section>

    <section class="example">
      <h2>2. Іменовані області</h2>
      <div class="layout layout-areas">
        <header class="region header">header</header>
        <nav class="region navigation">navigation</nav>
        <aside class="region sidebar">sidebar</aside>
        <section class="region content">main</section>
        <aside class="region ads">ads</aside>
        <footer class="region footer">footer</footer>
      </div>
    </section>
  </main>
</body>
</html>
